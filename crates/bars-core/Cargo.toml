[package]
name = "bars-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
async-channel = "2"
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
cpal = { version = "0.18", features = ["pulseaudio"] }
rubato = "5"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
xkbcommon = { version = "0.9", default-features = false }
wl-clipboard-rs = "0.9"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
nix = { version = "0.30", features = ["fs", "poll"] }
wayland-client = "0.31"
